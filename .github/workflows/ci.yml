name: DevSecOps based CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    # Trigger frontend job only if frontend files or CI workflow changed
    if: |
      github.event_name == 'push' && 
      (contains(github.event.head_commit.modified, 'frontend/') || 
       contains(github.event.head_commit.added, 'frontend/') ||
       contains(github.event.head_commit.removed, 'frontend/') ||
       contains(github.event.head_commit.modified, '.github/workflows/ci.yml'))
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
        
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
        
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Frontend Linting
        run: npm run lint
        working-directory: ./frontend

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        
      - name: Build Application
        run: npm run build
        working-directory: ./frontend
        
      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shopverse-front:${{ github.sha }} ./frontend
        
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/shopverse-front:${{ github.sha }}'
          exit-code: '1'
          severity: 'CRITICAL'
          
      - name: Push to Registry
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopverse-front:${{ github.sha }}

  backend-ci:
    runs-on: ubuntu-latest
    # Trigger backend job only if backend files or CI workflow changed
    if: |
      github.event_name == 'push' && 
      (contains(github.event.head_commit.modified, 'backend/') || 
       contains(github.event.head_commit.added, 'backend/') ||
       contains(github.event.head_commit.removed, 'backend/') ||
       contains(github.event.head_commit.modified, '.github/workflows/ci.yml'))
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
        
      - name: Run Gitleaks 
        uses: gitleaks/gitleaks-action@v2
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.21' }
        
      - name: Download Modules
        run: |
          go mod download
          go mod tidy
        working-directory: ./backend
        
      - name: Backend Linting
        uses: golangci/golangci-lint-action@v3
        with: { working-directory: ./backend }
        
      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        
      - name: Compile Go Binary
        run: go build -o main ./cmd
        working-directory: ./backend
        
      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/shopverse-back:${{ github.sha }} ./backend
        
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/shopverse-back:${{ github.sha }}'
          exit-code: '1'
          severity: 'CRITICAL'
          
      - name: Push to Registry
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/shopverse-back:${{ github.sha }}